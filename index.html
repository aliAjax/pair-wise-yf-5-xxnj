<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区种子图书馆 · 借还台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>🌱 社区种子图书馆 · 借还台</h1>
    <p class="meta">
      <span id="today"></span>
      <span class="rule">每人每月限借 2 包 · 库存 ≤ 4 包的品种预留 2 包给周末交换课</span>
      <button id="reset" type="button" class="btn btn-reset">恢复初始数据</button>
    </p>
  </header>

  <p id="message" class="message" hidden></p>

  <main>
    <!-- 首页看板：每人当月借阅 + 各品种库存 -->
    <section class="card">
      <h2>本月借阅情况</h2>
      <ul id="person-month" class="person-list"></ul>
    </section>

    <section class="card">
      <h2>种子库存</h2>
      <table id="seed-table">
        <thead>
          <tr>
            <th>品种</th><th>库存（包）</th><th>可借（包）</th>
            <th>采种年份</th><th>播种截止日</th><th>损耗（包）</th><th>状态</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 借种 -->
    <section class="card">
      <h2>借种登记</h2>
      <form id="borrow-form" class="borrow-form">
        <label>住户
          <select id="borrow-resident" required></select>
        </label>
        <label>品种
          <select id="borrow-seed" required></select>
        </label>
        <button type="submit" class="btn btn-primary">借出 1 包</button>
      </form>
    </section>

    <!-- 归还 -->
    <section class="card">
      <h2>待归还</h2>
      <p class="hint">归还时请确认种子是否还能发芽：可发芽的回库，失活的只记损耗。</p>
      <div id="active-loans"></div>
    </section>

    <!-- 记录 -->
    <section class="card">
      <h2>借还记录</h2>
      <div id="history"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
